<section class="my-8 p-4">
  <div class="container p-4 w-[90%] mx-auto">
    <h2 class="text-3xl font-extrabold text-slate-800 mb-8 tracking-tight border-b border-gray-100 pb-4">Our Brands</h2>
    <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
      @for (items of branditems; track items._id) {
        <div class="cursor-pointer bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-50 overflow-hidden group" [routerLink]="['/brandsdetails', items._id]">
          <div class="overflow-hidden p-4">
            <img [src]="items.image" [alt]="items.name" class="w-full h-[200px] object-contain group-hover:scale-105 transition-transform duration-500" />
          </div>
          <div class="p-4 text-center bg-slate-50 border-t border-gray-100">
            <h1 class="text-xl font-bold text-slate-800 group-hover:text-emerald-500 transition-colors">{{ items.name }}</h1>
          </div>
        </div>
      }
    </div>
  </div>
</section>
