<div class='max-w-xl mx-auto mt-8 mb-6 px-4'>
  <div class="relative flex items-center w-full h-14 rounded-full focus-within:shadow-xl bg-white overflow-hidden shadow-md transition-shadow duration-300 border border-gray-100">
      <div class="grid place-items-center h-full w-14 text-emerald-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
      </div>

      <input
      [(ngModel)]="searchvalue"
      class="peer h-full w-full outline-none focus:outline-none focus:ring-0 border-none text-gray-700 pr-4 bg-transparent placeholder-gray-400"
      type="text"
      id="search"
      placeholder="Search for products..." /> 
  </div>
</div>
<section>
<div class="container p-4 w-[90%] mx-auto">
    <div
      class="grid gap-4 grid-cols-1 sm:grid-cols-2 md:grid-col-3 lg:grid-cols-5"
    >
      @for (product of productdata | search:searchvalue;track product._id) {
      <div class="product p-5 flex flex-col justify-between" >
        <div class="cursor-pointer group" [routerLink]="['/Prod-details', product._id ]">
          <div class="mt-2 overflow-hidden rounded-xl">
            <img [src]="product.imageCover" [alt]="product.title" class="w-full object-cover group-hover:scale-105 transition-transform duration-500" />
          </div>
          <div class="mt-4">
            <h4 class="text-emerald-500 font-semibold text-sm uppercase tracking-wide">{{ product.category.name }}</h4>
            <h1 class="font-bold text-slate-800 text-lg leading-tight mt-1">{{ product.title.split(" ").slice(0,3).join(" ") }}</h1>
          </div>
          <div class="flex mt-3 mb-2 flex-wrap justify-between items-center">
            <h3 class="font-bold text-slate-900">{{ product.price | currency:'GBP' }}</h3>
            <span class="flex items-center gap-1 font-medium text-slate-600"
              ><i class="rating-color fa-solid fa-star"></i
              >{{ product.ratingsAverage }}</span
            >
          </div>
        </div>
        
        <div class="mt-auto pt-4">
          <button (click)="addtocart(product._id)" type="button" class="btn-main w-full shadow-sm hover:shadow-md">Add To Cart</button>
        </div>
      </div>


      }
    </div>
  </div>
</section>
