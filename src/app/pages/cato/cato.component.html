


@if(catodata != null) {
  <div class="container p-4 w-[90%] mx-auto mt-8 mb-12">
    <h2 class="text-3xl font-extrabold text-slate-800 mb-8 tracking-tight border-b border-gray-100 pb-4">Categories</h2>
    
    <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
      @for (cato of catodata; track cato._id) {
        <div class="cursor-pointer bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-50 overflow-hidden group" [routerLink]="['/catodetails', cato._id]">
          <div class="overflow-hidden">
            <img [src]="cato.image" [alt]="cato.name" class="w-full h-[250px] object-cover group-hover:scale-105 transition-transform duration-500" />
          </div>
          <div class="p-4 text-center bg-white">
            <h1 class="text-xl font-bold text-slate-800 group-hover:text-emerald-500 transition-colors">{{ cato.name }}</h1>
          </div>
        </div>
      }
    </div>
  </div>
}
