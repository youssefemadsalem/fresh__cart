<div class="container p-4 w-[90%] mx-auto mt-8 mb-12">
  <h2 class="text-3xl font-extrabold text-slate-800 mb-8 tracking-tight border-b border-gray-100 pb-4">My Wishlist</h2>
  
  @if (wishlistdata.length) {
    <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
      @for (product of wishlistdata; track product.id) {
        <div class="product p-5 flex flex-col justify-between group bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-50 relative">
          <div class="cursor-pointer" [routerLink]="['/Prod-details', product._id]">
            <div class="mt-2 overflow-hidden rounded-xl">
              <img [src]="product.imageCover" [alt]="product.title" class="w-full object-cover group-hover:scale-105 transition-transform duration-500" />
            </div>
            <div class="mt-4">
              <h1 class="font-bold text-slate-800 text-lg leading-tight mt-1 truncate">{{ product.title }}</h1>
            </div>
            <div class="flex mt-3 mb-2 flex-wrap justify-between items-center">
              <h3 class="font-bold text-slate-900">{{ product.price | currency:'GBP' }}</h3>
              <span class="flex items-center gap-1 font-medium text-slate-600 bg-slate-50 px-2 py-1 rounded-full text-sm"
                ><i class="rating-color fa-solid fa-star"></i
                >{{ product.ratingsAverage }}</span
              >
            </div>
          </div>
          
          <div class="mt-auto pt-4 flex gap-2">
            <button type="button" class="btn-main flex-1 shadow-sm hover:shadow-md px-2 py-2.5 text-sm whitespace-nowrap" (click)="addtocart(product._id)">Add to Cart</button>
            <button type="button" class="bg-red-50 text-red-600 hover:bg-red-500 hover:text-white border border-red-100 transition-colors rounded-lg flex items-center justify-center px-4 shadow-sm" (click)="remove(product._id)">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="text-center py-20 bg-white rounded-3xl shadow-sm border border-gray-100">
      <i class="fa-regular fa-heart text-6xl text-gray-300 mb-4"></i>
      <h3 class="text-2xl font-bold text-slate-700">Your wishlist is empty</h3>
      <p class="text-slate-500 mt-2">Explore our products and add some items!</p>
      <button routerLink="/products" class="btn-main mt-6">Browse Products</button>
    </div>
  }
</div>
