<section class="bg-white rounded-3xl p-8 my-12 w-[90%] max-w-xl mx-auto shadow-2xl border border-gray-100">
  <h1 class="text-emerald-500 font-extrabold text-4xl mb-8 text-center tracking-tight">Checkout</h1>
  
  <form [formGroup]="detailsform" (ngSubmit)="details()">
    <div class="my-4">
      <label for="details" class="block mb-2 text-sm font-semibold text-slate-700">Shipping Details</label>
      <input
        formControlName="details"
        type="text"
        id="details"
        placeholder="e.g. 123 Main St, Apt 4B"
        class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-emerald-500 focus:border-emerald-500 block w-full p-3 transition-colors"
      />
    </div>

    <div class="my-4">
      <label for="phone" class="block mb-2 text-sm font-semibold text-slate-700">Phone Number</label>
      <input
        formControlName="phone"
        type="tel"
        id="phone"
        placeholder="+1 (555) 000-0000"
        class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-emerald-500 focus:border-emerald-500 block w-full p-3 transition-colors"
      />
    </div>

    <div class="my-4">
      <label for="city" class="block mb-2 text-sm font-semibold text-slate-700">City</label>
      <input
        formControlName="city"
        type="text"
        id="city"
        placeholder="e.g. New York"
        class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-emerald-500 focus:border-emerald-500 block w-full p-3 transition-colors"
      />
    </div>

    <div>
      <button class="btn-main w-full py-3 text-lg mt-6 shadow-lg hover:shadow-xl transition-all duration-300 flex justify-center items-center gap-2">
        Proceed to Payment <i class="fa-solid fa-credit-card ml-2"></i>
      </button>
    </div>
  </form>
</section>
